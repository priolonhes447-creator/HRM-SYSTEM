<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Employee Portal</title>
    <style>
        body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; background: #f8fafc; color: #1f2937; font: 16px/1.6 Arial, sans-serif; }
        main { width: min(520px, 100%); padding: 28px; border: 1px solid #e2e8f0; border-radius: 14px; background: #fff; box-shadow: 0 12px 35px rgba(15, 23, 42, .08); }
        h1 { margin: 0 0 10px; font-size: 22px; }
        p { margin: 0 0 20px; color: #64748b; }
        a, button { display: inline-block; padding: 10px 16px; border: 0; border-radius: 8px; background: #2f80ed; color: #fff; font: inherit; text-decoration: none; cursor: pointer; }
        #portal-unavailable[hidden] { display: none; }
    </style>
</head>
<body>
    <main id="portal-unavailable" hidden>
        <h1>Employee portal unavailable</h1>
        <p>This installation does not include an Employee Self-Service dashboard. If you need HR access, sign out and sign in with your HR account.</p>
        <button type="button" onclick="logout()">Sign out</button>
    </main>
    <script src="config.js"></script>
    <script src="auth.js?v=hr-role-20261006"></script>
    <script>
        const currentUser = getCurrentUser();
        const isHrAccount = currentUser?.role === 'hr'
            || currentUser?.role === 'admin'
            || (currentUser?.email || '').trim().toLowerCase() === 'phnhes@gmail.com';

        if (isHrAccount) {
            window.location.replace('dashboard.html?v=hr-role-20261006');
        } else if (!currentUser || !getToken()) {
            window.location.replace('index.html');
        } else {
            document.getElementById('portal-unavailable').hidden = false;
        }
    </script>
</body>
</html>
